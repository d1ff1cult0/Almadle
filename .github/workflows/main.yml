name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and Deploy
        run: |
          # 1. Navigate to the project directory
          cd /home/d1ff1cult/Server/Almadle

          # 2. Pull the latest code
          git pull origin main


          # 3. Prepare Environment
          # Create data directory for SQLite and ensure write permissions for the container user
          mkdir -p data
          chmod 777 data

          # 4. Build and Start
          docker compose build --no-cache
          docker compose up -d
